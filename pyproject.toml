[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eth-validator-stats"
version = "0.3.4"
description = "Tiny self-hosted CLI for Ethereum validator stats, backed by your own beacon node."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Workharu", email = "Workharu@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Internet",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "segno>=1.6",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/Workharu/eth-validator-stats"
Source = "https://github.com/Workharu/eth-validator-stats"
Issues = "https://github.com/Workharu/eth-validator-stats/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
eth-validator-stats = "eth_validator_stats.cli:main"
# Short alias for muscle-memory comfort. Identical behavior to the
# canonical `eth-validator-stats` binary.
evs = "eth_validator_stats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_validator_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
