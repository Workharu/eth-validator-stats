[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eth-validator-stats"
version = "0.6.1"
description = "Tiny self-hosted CLI for Ethereum validator stats, backed by your own beacon node."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Workharu", email = "Workharu@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Internet",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "segno>=1.6",
    "platformdirs>=4.0",
    "typer>=0.12,<1.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Workharu/eth-validator-stats"
Source = "https://github.com/Workharu/eth-validator-stats"
Issues = "https://github.com/Workharu/eth-validator-stats/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes + style; I = isort; UP = pyupgrade; B = likely bugs; W = warnings
select = ["E", "F", "I", "UP", "B", "W"]
# Long lines in docstrings/error-message strings aren't worth a CI failure.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # tests use plain `assert`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=eth_validator_stats --cov-report=term-missing:skip-covered"

[project.scripts]
eth-validator-stats = "eth_validator_stats.cli:main"
# Short alias for muscle-memory comfort. Identical behavior to the
# canonical `eth-validator-stats` binary.
evs = "eth_validator_stats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_validator_stats"]
