[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eth-validator-stats"
version = "0.1.0"
description = "Tiny self-hosted CLI for Ethereum validator stats, backed by your own beacon node."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "segno>=1.6",
    "platformdirs>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
eth-validator-stats = "eth_validator_stats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_validator_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
