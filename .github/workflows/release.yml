# One-time PyPI setup required before the first run:
#   1. Create the project on https://pypi.org if it doesn't exist
#      (the first `uv build` upload via this workflow does this automatically).
#   2. Add Workharu/eth-validator-stats as a trusted publisher on PyPI:
#        https://pypi.org/manage/account/publishing/
#      - Repository owner: Workharu
#      - Repository name:  eth-validator-stats
#      - Workflow name:    release.yml
#      - Environment name: (leave blank)
#   3. After step 2, tagged releases publish automatically — no API token needed.
name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write       # for attaching .deb/.rpm to GitHub Releases (added in later tasks)
  id-token: write       # for PyPI trusted publisher OIDC

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify pinned version references agree
        run: ./scripts/bump.sh --verify

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "ERROR: git tag $GITHUB_REF_NAME does not match pyproject version $PROJECT_VERSION"
            exit 1
          fi

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1

  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify pinned version references agree
        run: ./scripts/bump.sh --verify

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper adduser curl

      - name: Build .deb
        run: ./packaging/deb/build-deb.sh

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb

  build-rpm:
    name: Build .rpm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: registry.fedoraproject.org/fedora:40
    # Job-level env and defaults pin PATH and shell so the `uv` install
    # script can't mutate $GITHUB_ENV in a way that drops /usr/bin from the
    # env passed to subsequent `docker exec` calls (the bug that previously
    # broke later steps with "exec: \"sh\": executable file not found").
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        shell: /bin/bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify pinned version references agree
        run: ./scripts/bump.sh --verify

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build systemd-rpm-macros tar git curl

      - name: Install uv inside the container
        # uv's install script writes a PATH=<install-dir> line to $GITHUB_ENV
        # in CI environments. That line drops /usr/bin from the env passed
        # to subsequent `docker exec` calls (and overrides job-level env.PATH,
        # since $GITHUB_ENV takes precedence), breaking later steps with
        # "env: 'bash': No such file or directory" or similar. Redirect both
        # $GITHUB_ENV and $GITHUB_PATH to /dev/null so the install script
        # can't pollute the runner env, then copy uv into /usr/local/bin
        # which is already on the default PATH.
        run: |
          set -eux
          curl -LsSf https://astral.sh/uv/install.sh > /tmp/install-uv.sh
          GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null bash /tmp/install-uv.sh
          install -m 0755 "$HOME/.local/bin/uv"   /usr/local/bin/uv
          install -m 0755 "$HOME/.local/bin/uvx"  /usr/local/bin/uvx
          /usr/local/bin/uv --version

      - name: Build .rpm
        run: ./packaging/rpm/build-rpm.sh

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.rpm
