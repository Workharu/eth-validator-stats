name: pre-release-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run pytest -q

  build-check-wheel:
    name: Wheel build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv build
      - run: uv run --with twine twine check dist/*

  smoke-deb:
    name: Smoke-test .deb build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper python3.11 python3.11-venv adduser lintian

      - name: Build .deb
        run: ./packaging/deb/build-deb.sh

      - name: Lint .deb
        run: lintian --suppress-tags new-package-should-close-itp-bug dist/*.deb || true

      - name: Verify package metadata
        run: |
          dpkg --info dist/*.deb
          echo "===== full package contents ====="
          dpkg --contents dist/*.deb
          echo "===== checking that /etc and /var/lib are NOT shipped in the .deb ====="
          if dpkg --contents dist/*.deb | grep -E "\./etc/eth-validator-stats|\./var/lib/eth-validator-stats"; then
            echo "WARNING: package owns /etc or /var/lib paths"
          else
            echo "OK: package does not own /etc or /var/lib"
          fi

      - name: Install + smoke-test the service unit
        run: |
          sudo apt-get install -y ./dist/*.deb
          # The service is enabled but inactive (config missing). That's expected.
          systemctl status eth-validator-stats || true
          # Verify the unit reports start-condition-not-met (not a hard failure).
          if systemctl status eth-validator-stats 2>&1 | grep -q "ConditionPathExists"; then
            echo "OK: service is gated on config presence"
          else
            echo "ERROR: service did not honor ConditionPathExists"
            systemctl status eth-validator-stats
            exit 1
          fi
          # Service user exists
          id eth-validator-stats
          # Entrypoint runs
          /opt/eth-validator-stats/venv/bin/eth-validator-stats --help >/dev/null

      - name: Verify apt remove preserves user-created config
        run: |
          set -x
          # Diagnostic: what's in /etc and /var/lib BEFORE we write anything?
          ls -la /etc/eth-validator-stats /var/lib/eth-validator-stats || true

          # Simulate a user-created config (normally written by `init --system`)
          # and a state file.
          echo "beacon_node_url: http://localhost:3500" \
              | sudo tee /etc/eth-validator-stats/config.yml >/dev/null
          echo "{}" | sudo tee /var/lib/eth-validator-stats/state.json >/dev/null

          # Diagnostic: confirm the files actually got written
          echo "===== after write ====="
          ls -la /etc/eth-validator-stats /var/lib/eth-validator-stats
          sudo cat /etc/eth-validator-stats/config.yml

          # Diagnostic: which package owns these paths? (should be NONE)
          echo "===== dpkg ownership of /etc/eth-validator-stats ====="
          dpkg-query -S /etc/eth-validator-stats 2>&1 || true
          dpkg-query -S /etc/eth-validator-stats/config.yml 2>&1 || true

          sudo apt-get remove -y eth-validator-stats

          # Diagnostic: state AFTER apt remove
          echo "===== after apt remove ====="
          ls -la /etc/eth-validator-stats 2>&1 || echo "/etc/eth-validator-stats no longer exists"
          ls -la /var/lib/eth-validator-stats 2>&1 || echo "/var/lib/eth-validator-stats no longer exists"

          test -f /etc/eth-validator-stats/config.yml \
              || (echo "ERROR: user config.yml removed on apt remove"; exit 1)
          test -f /var/lib/eth-validator-stats/state.json \
              || (echo "ERROR: state.json removed on apt remove"; exit 1)
          echo "OK: user config and state preserved on remove"

      - name: Verify apt purge wipes everything
        run: |
          sudo apt-get purge -y eth-validator-stats
          test ! -d /etc/eth-validator-stats || (echo "ERROR: config dir survived purge"; exit 1)
          test ! -d /var/lib/eth-validator-stats || (echo "ERROR: state dir survived purge"; exit 1)
          if id eth-validator-stats 2>/dev/null; then
            echo "ERROR: service user survived purge"
            exit 1
          fi
          echo "OK: full cleanup on purge"

  smoke-rpm:
    name: Smoke-test .rpm build
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora-toolbox:40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build python3.11 python3.11-devel systemd-rpm-macros tar git rpmlint

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build .rpm
        run: ./packaging/rpm/build-rpm.sh

      - name: rpmlint the package
        run: rpmlint dist/*.rpm || true

      - name: Verify package metadata
        run: rpm -qpi dist/*.rpm && rpm -qpl dist/*.rpm | head -30

      - name: Verify the spec scriptlets parse
        run: rpm -qp --scripts dist/*.rpm
