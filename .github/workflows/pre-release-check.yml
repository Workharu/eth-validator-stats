name: pre-release-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run pytest -q

  build-check-wheel:
    name: Wheel build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv build
      - run: uv run --with twine twine check dist/*

  smoke-deb:
    name: Smoke-test .deb build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper adduser curl lintian

      - name: Build .deb
        run: ./packaging/deb/build-deb.sh

      - name: Lint .deb
        run: lintian --suppress-tags new-package-should-close-itp-bug dist/*.deb || true

      - name: Verify package metadata
        run: |
          dpkg --info dist/*.deb
          dpkg --contents dist/*.deb | head -30

      - name: Install + smoke-test the service unit
        run: |
          sudo apt-get install -y ./dist/*.deb
          systemctl status eth-validator-stats || true
          if systemctl status eth-validator-stats 2>&1 | grep -q "ConditionPathExists"; then
            echo "OK: service is gated on config presence"
          else
            echo "ERROR: service did not honor ConditionPathExists"
            systemctl status eth-validator-stats
            exit 1
          fi
          id eth-validator-stats
          /opt/eth-validator-stats/venv/bin/eth-validator-stats --help >/dev/null

      - name: Verify apt remove preserves user-created config
        run: |
          set -x
          sudo ls -la /etc/eth-validator-stats /var/lib/eth-validator-stats
          echo "beacon_node_url: http://localhost:3500" \
              | sudo tee /etc/eth-validator-stats/config.yml >/dev/null
          echo "{}" | sudo tee /var/lib/eth-validator-stats/state.json >/dev/null
          sudo ls -la /etc/eth-validator-stats /var/lib/eth-validator-stats
          sudo apt-get remove -y eth-validator-stats
          sudo test -f /etc/eth-validator-stats/config.yml \
              || { echo "ERROR: user config.yml removed on apt remove"; exit 1; }
          sudo test -f /var/lib/eth-validator-stats/state.json \
              || { echo "ERROR: state.json removed on apt remove"; exit 1; }
          echo "OK: user config and state preserved on remove"

      - name: Verify apt purge wipes everything
        run: |
          sudo apt-get purge -y eth-validator-stats
          test ! -d /etc/eth-validator-stats || (echo "ERROR: config dir survived purge"; exit 1)
          test ! -d /var/lib/eth-validator-stats || (echo "ERROR: state dir survived purge"; exit 1)
          if id eth-validator-stats 2>/dev/null; then
            echo "ERROR: service user survived purge"
            exit 1
          fi
          echo "OK: full cleanup on purge"

  smoke-rpm:
    name: Smoke-test .rpm build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: registry.fedoraproject.org/fedora:40
    # Job-level env and defaults pin PATH and shell so the `uv` install
    # script can't mutate $GITHUB_ENV in a way that drops /usr/bin from the
    # env passed to subsequent `docker exec` calls (the bug that previously
    # broke later steps with "exec: \"sh\": executable file not found").
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        shell: /bin/bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build systemd-rpm-macros tar git curl rpmlint

      - name: Install uv inside the container
        # uv's install script writes a PATH=<install-dir> line to $GITHUB_ENV
        # in CI environments. That line drops /usr/bin from the env passed
        # to subsequent `docker exec` calls (and overrides job-level env.PATH,
        # since $GITHUB_ENV takes precedence), breaking later steps with
        # "env: 'bash': No such file or directory" or similar. Redirect both
        # $GITHUB_ENV and $GITHUB_PATH to /dev/null so the install script
        # can't pollute the runner env, then copy uv into /usr/local/bin
        # which is already on the default PATH.
        run: |
          set -eux
          curl -LsSf https://astral.sh/uv/install.sh > /tmp/install-uv.sh
          GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null bash /tmp/install-uv.sh
          install -m 0755 "$HOME/.local/bin/uv"   /usr/local/bin/uv
          install -m 0755 "$HOME/.local/bin/uvx"  /usr/local/bin/uvx
          /usr/local/bin/uv --version

      - name: Build .rpm
        run: ./packaging/rpm/build-rpm.sh

      - name: rpmlint the package
        run: rpmlint dist/*.rpm || true

      - name: Verify package metadata
        run: rpm -qpi dist/*.rpm && rpm -qpl dist/*.rpm | head -30

      - name: Verify the spec scriptlets parse
        run: rpm -qp --scripts dist/*.rpm
