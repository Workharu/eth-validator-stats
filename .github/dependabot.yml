version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      runtime:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "black", "mypy"]
      dev:
        applies-to: version-updates
        patterns: ["pytest*", "ruff", "black", "mypy"]
